services:
  # Socket.IO signaling server
  - type: web
    name: webrtc-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 18
      # Set to your frontend URL after first deploy, e.g. https://webrtc-client.onrender.com
      - key: CLIENT_URL
        sync: false

  # React static site
  - type: web
    name: webrtc-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      # Set to your backend URL, e.g. https://webrtc-server.onrender.com
      - key: REACT_APP_SERVER_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
