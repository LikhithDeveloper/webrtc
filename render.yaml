services:
  # Single service: Node server serves the React build + Socket.IO signaling
  - type: web
    name: webrtc
    runtime: node
    plan: free
    buildCommand: npm --prefix client install && npm --prefix client run build && npm --prefix server install
    startCommand: node server/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 18
